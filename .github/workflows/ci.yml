name: CI

on:
  push:
    paths-ignore:
      - artifacts/**
      - napi/artifacts/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - run: deno task check

  native:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: darwin-aarch64
            artifact: libmtkruto_ige.dylib
          - os: macos-15-intel
            target: darwin-x86_64
            artifact: libmtkruto_ige.dylib
          - os: ubuntu-24.04
            target: linux-x86_64
            artifact: libmtkruto_ige.so
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            artifact: libmtkruto_ige.so
          - os: windows-latest
            target: windows-x86_64
            artifact: mtkruto_ige.dll
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: napi/package-lock.json
      - run: npm ci --prefix napi
      - run: deno task test
      - run: deno task test:napi
      - name: Verify reproducible Windows artifacts
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $dll = "artifacts/windows-x86_64/mtkruto_ige.dll"
          $addon = "napi/artifacts/windows-x86_64/mtkruto_ige.node"
          $dllBefore = (Get-FileHash $dll -Algorithm SHA256).Hash
          $addonBefore = (Get-FileHash $addon -Algorithm SHA256).Hash

          Start-Sleep -Seconds 2
          deno task build
          deno task build:napi

          $dllAfter = (Get-FileHash $dll -Algorithm SHA256).Hash
          $addonAfter = (Get-FileHash $addon -Algorithm SHA256).Hash
          if ($dllBefore -ne $dllAfter) {
            throw "mtkruto_ige.dll is not reproducible."
          }
          if ($addonBefore -ne $addonAfter) {
            throw "mtkruto_ige.node is not reproducible."
          }
      - name: Commit artifacts
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "artifacts/${{ matrix.target }}/${{ matrix.artifact }}" \
            "napi/artifacts/${{ matrix.target }}/mtkruto_ige.node"
          git diff --cached --quiet && exit 0
          git commit -m "Update ${{ matrix.target }}"

          attempt=1
          while true; do
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
            elif git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying."
            attempt=$((attempt + 1))
            sleep 5
          done
