name: CI

on:
  push:
    paths-ignore:
      - artifacts/**

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - run: deno task check

  native:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-aarch64
            artifact: libmtkruto_ige.dylib
          - os: ubuntu-24.04
            target: linux-x86_64
            artifact: libmtkruto_ige.so
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            artifact: libmtkruto_ige.so
          - os: windows-latest
            target: windows-x86_64
            artifact: mtkruto_ige.dll
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
      - run: deno task test
      - name: Commit artifacts
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "artifacts/${{ matrix.target }}/${{ matrix.artifact }}"
          git diff --cached --quiet && exit 0
          git commit -m "chore: update ${{ matrix.target }} artifact"

          attempt=1
          while true; do
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
            elif git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying."
            attempt=$((attempt + 1))
            sleep 5
          done
